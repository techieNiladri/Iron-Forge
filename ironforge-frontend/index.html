<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ironforge Tracker</title>
     <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>IronForge <span class = "accent">Tracker</span></h1>
        </header>
        <div class="input-section glass-panel">
            <input type="text" id="exercise" placeholder="Exercise(e.g. Deadlift)">
            <input type="text" id="weight" placeholder="Weight(lbs)">
            <input type="number" id="reps" placeholder="Reps">
            <input type="number" id="sets" placeholder="Sets">
            <button id="add-btn">Add Set</button>
        </div>
        <ul id="workout-list">

        </ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
